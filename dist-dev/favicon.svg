<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon do Elemental Battle: Merge Arena — losango elemental FUNDIDO:
       metade fogo (gradiente magma do jogo), metade água/terra (teal do anel
       de seleção), costura dourada da fusão no meio. -->
  <defs>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#ff5e2a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ad4ff"/>
      <stop offset="1" stop-color="#3ce9a4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0e1a"/>
  <path d="M32 9 L50 32 L32 55 L14 32 Z" fill="url(#fire)"/>
  <path d="M32 9 L50 32 L32 55 Z" fill="url(#water)"/>
  <path d="M32 9 L32 55" stroke="#ffd23f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 9 L50 32 L32 55 L14 32 Z" fill="none" stroke="#e8f0ff" stroke-opacity="0.35" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="3.2" fill="#fff4d9"/>
</svg>
