name: Deploy no GitHub Pages

# main  → deploy de PRODUÇÃO na URL do site (como sempre).
# dev   → deploy de PREVIEW do GitHub Pages: as branches que não são a
#         produção viram deployments de branch com URL própria, SEM tocar no
#         site publicado. A URL exata sai do output `page_url` do
#         deploy-pages — o step "Publicado" imprime ela no resumo da execução
#         (Actions → Deploy no GitHub Pages → job Deploy).
# Também dá para disparar manualmente (Run workflow → escolher a branch).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base do build conforme a branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo 'VITE_BASE=/element-merge/' >> "$GITHUB_ENV"
          else
            # o diretório do preview só existe depois do deploy; base
            # relativa ('./') resolve assets em qualquer subdiretório
            echo 'VITE_BASE=./' >> "$GITHUB_ENV"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publicado
        run: |
          echo "🔗 ${{ steps.deployment.outputs.page_url }}" | tee -a "$GITHUB_STEP_SUMMARY"
