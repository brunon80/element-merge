name: Deploy no GitHub Pages

# O GitHub Pages tem UM site de produção por repositório — o parâmetro
# `preview` do deploy-pages continua em alpha FECHADO para repositórios
# públicos (confirmado 05/nov/2026 na action.yml e nas discussões da
# comunidade), e por padrão QUALQUER branch que roda o workflow vira o site:
# foi assim que a dev sobrescreveu a main no mesmo endereço. A correção é
# lavrar o preview da dev DENTRO do site: cada execução monta os DOIS builds
# num único artifact —
#   main → raiz  https://…/element-merge/        (sempre o build da main)
#   dev  → subpasta https://…/element-merge/dev/ (preview da branch)
# Assim nenhum push de branch consegue trocar o conteúdo da raiz: a raiz é
# sempre o build da main, e um push na main reimplanta o preview da dev junto.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# as duas branches publicam o MESMO site — a fila serializa em vez de
# cancelar um deploy de produção em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build main (raiz do site)
        run: |
          set -o pipefail
          npm run build -- --outDir dist-main 2>&1 | tee /tmp/build-main.log | tail -25
        env:
          VITE_BASE: /element-merge/
      - uses: actions/checkout@v4
        with:
          ref: dev
          # ARMADILHA (custou 4 deploys quebrados em silêncio): com o padrão
          # clean: true, o segundo checkout roda `git clean -ffdx` — o -x
          # APAGA os ignorados: node_modules/ (instalado no npm ci) E o
          # dist-main/ recém-construído somem; o build da dev então morre em
          # "sh: 1: tsc: not found" (exit 1 sem erro de código — por isso o
          # log era inútil). Aqui a limpeza é DESLIGADA: o checkout só troca
          # os arquivos rastreados para o ref dev; node_modules e dist-main
          # sobrevivem de propósito.
          clean: false
      - name: Build dev (preview em /dev/)
        run: |
          set -o pipefail
          npm run build -- --outDir dist-dev 2>&1 | tee /tmp/build-dev.log | tail -25
        env:
          VITE_BASE: /element-merge/dev/
      - name: Montar o site (main na raiz, dev em /dev/)
        run: |
          mkdir -p dist/dev
          cp -r dist-main/. dist/
          cp -r dist-dev/. dist/dev/
      - name: 🔬 Logs no sumário da execução (só quando falha)
        if: failure()
        run: |
          {
            echo '<details><summary>🔬 build logs</summary><pre>'
            echo "run $GITHUB_RUN_ID — node $(node --version), npm $(npm --version)"
            echo '--- build-main.log ---'
            tail -60 /tmp/build-main.log 2>/dev/null || echo '(main: não rodou)'
            echo '--- build-dev.log ---'
            tail -60 /tmp/build-dev.log 2>/dev/null || echo '(dev: não rodou)'
            echo '</pre></details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publicado
        run: |
          echo "🔗 Produção (main): ${{ steps.deployment.outputs.page_url }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "🧪 Preview (dev): ${{ steps.deployment.outputs.page_url }}dev/" | tee -a "$GITHUB_STEP_SUMMARY"
