name: Deploy no GitHub Pages

# O GitHub Pages tem UM site de produção por repositório — o parâmetro
# `preview` do deploy-pages continua em alpha FECHADO para repositórios
# públicos (confirmado 05/nov/2026 na action.yml e nas discussões da
# comunidade), e por padrão QUALQUER branch que roda o workflow vira o site:
# foi assim que a dev sobrescreveu a main no mesmo endereço. A correção é
# lavrar o preview da dev DENTRO do site: cada execução monta os DOIS builds
# num único artifact —
#   main → raiz  https://…/element-merge/        (sempre o build da main)
#   dev  → subpasta https://…/element-merge/dev/ (preview da branch)
# Assim nenhum push de branch consegue trocar o conteúdo da raiz: a raiz é
# sempre o build da main, e um push na main reimplanta o preview da dev junto.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # TEMPORÁRIO (diagnóstico): sem gh autenticado nesta máquina, o log do
  # Actions é privado; num FALHA, o job publica o pé do log num issue público.
  # Remover quando o pipeline estiver estável.
  issues: write

# as duas branches publicam o MESMO site — a fila serializa em vez de
# cancelar um deploy de produção em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build main (raiz do site)
        run: |
          set -o pipefail
          npm run build -- --outDir dist-main 2>&1 | tee /tmp/build-main.log | tail -25
        env:
          VITE_BASE: /element-merge/
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Build dev (preview em /dev/)
        run: |
          set -o pipefail
          npm run build -- --outDir dist-dev 2>&1 | tee /tmp/build-dev.log | tail -25
        env:
          VITE_BASE: /element-merge/dev/
      - name: Montar o site (main na raiz, dev em /dev/)
        run: |
          mkdir -p dist/dev
          cp -r dist-main/. dist/
          cp -r dist-dev/. dist/dev/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 🔬 Diagnóstico público (só quando falha)
        if: failure()
        run: |
          set +e
          {
            echo "## Falha no job build (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
            echo "- node: $(node --version) / npm: $(npm --version)"
            echo '### build-main.log (pé)'
            tail -30 /tmp/build-main.log 2>/dev/null || echo '(não rodou)'
            echo '### build-dev.log (pé)'
            tail -30 /tmp/build-dev.log 2>/dev/null || echo '(não rodou)'
            echo '### env'
            env | grep -E '^(VITE_BASE|CI|GITHUB_REF_NAME)=' | sort
          } > /tmp/diag.md
          # canal zero (sem permissione nenhuma): o STEP SUMMARY do job é
          # público — renderizado na página da execução no Actions
          {
            echo '<details><summary>🔬 build logs</summary>'
            echo '```'
            cat /tmp/diag.md
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/diag.md
          # canal 1 (contents:write): empurra o texto para o branch ci-diag —
          # não dispara workflow nenhum (deploy só escuta main/dev)
          git init -q /tmp/diagrepo && cd /tmp/diagrepo
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp /tmp/diag.md diag.md
          git -c user.name=ci -c user.email=ci@github.com add -A
          git -c user.name=ci -c user.email=ci@github.com commit -qm "diag run $GITHUB_RUN_ID"
          git push -q origin HEAD:refs/heads/ci-diag
          # canal 2 (issues:write): issue público como plano B
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔧 Build do deploy falhou (run $GITHUB_RUN_ID)" \
            --body-file /tmp/diag.md
          exit 0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publicado
        run: |
          echo "🔗 Produção (main): ${{ steps.deployment.outputs.page_url }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "🧪 Preview (dev): ${{ steps.deployment.outputs.page_url }}dev/" | tee -a "$GITHUB_STEP_SUMMARY"
