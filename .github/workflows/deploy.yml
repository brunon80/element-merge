name: Deploy no GitHub Pages

# O GitHub Pages tem UM site de produção por repositório — o parâmetro
# `preview` do deploy-pages continua em alpha FECHADO para repositórios
# públicos (confirmado 05/nov/2026 na action.yml e nas discussões da
# comunidade), e por padrão QUALQUER branch que roda o workflow vira o site:
# foi assim que a dev sobrescreveu a main no mesmo endereço. A correção é
# lavrar o preview da dev DENTRO do site: cada execução monta os DOIS builds
# num único artifact —
#   main → raiz  https://…/element-merge/        (sempre o build da main)
#   dev  → subpasta https://…/element-merge/dev/ (preview da branch)
# Assim nenhum push de branch consegue trocar o conteúdo da raiz: a raiz é
# sempre o build da main, e um push na main reimplanta o preview da dev junto.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # (diagnóstico por issue/git-teste foi removido: o GITHUB_TOKEN distribuído
  # aqui NÃO ganhou write mesmo com permissions declarado — o canal público
  # que funciona é o próprio Pages, via artifact de diagnóstico)

# as duas branches publicam o MESMO site — a fila serializa em vez de
# cancelar um deploy de produção em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build main (raiz do site)
        run: |
          set -o pipefail
          npm run build -- --outDir dist-main 2>&1 | tee /tmp/build-main.log | tail -25
        env:
          VITE_BASE: /element-merge/
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Build dev (preview em /dev/)
        run: |
          set -o pipefail
          npm run build -- --outDir dist-dev 2>&1 | tee /tmp/build-dev.log | tail -25
        env:
          VITE_BASE: /element-merge/dev/
      - name: Montar o site (main na raiz, dev em /dev/)
        run: |
          mkdir -p dist/dev
          cp -r dist-main/. dist/
          cp -r dist-dev/. dist/dev/
      - name: 🔬 Diagnóstico público (só quando falha)
        if: failure()
        run: |
          set +e
          {
            echo "## Falha no job build (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
            echo "- node: $(node --version) / npm: $(npm --version)"
            echo '### build-main.log (pé)'
            tail -40 /tmp/build-main.log 2>/dev/null || echo '(não rodou)'
            echo '### build-dev.log (pé)'
            tail -40 /tmp/build-dev.log 2>/dev/null || echo '(não rodou)'
            echo '### env'
            env | grep -E '^(VITE_BASE|CI|GITHUB_REF_NAME)=' | sort
          } > /tmp/diag.md
          cat /tmp/diag.md
          # canal Pages: a falha publica uma página de diagnóstico com os
          # logs; o próximo deploy bom repõe o site. curl lê sem login algum.
          mkdir -p dist-diag
          {
            echo '<!doctype html><meta charset="utf-8"><title>diag</title>'
            echo '<h1>🔬 build do deploy falhou — run '"$GITHUB_RUN_ID"'</h1><pre>'
            sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' /tmp/diag.md
            echo '</pre>'
          } > dist-diag/index.html
          {
            echo '<details><summary>🔬 build logs</summary><pre>'
            sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g' /tmp/diag.md
            echo '</pre></details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: ${{ failure() && 'dist-diag' || 'dist' }}

  deploy:
    needs: build
    # roda também com o build FALHO: o artifact então é a página de
    # diagnóstico — o site fica temporariamente diagnóstico até o próximo
    # deploy bom (é o preço de enxergar o erro sem login)
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publicado
        run: |
          echo "🔗 Produção (main): ${{ steps.deployment.outputs.page_url }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "🧪 Preview (dev): ${{ steps.deployment.outputs.page_url }}dev/" | tee -a "$GITHUB_STEP_SUMMARY"
